<title>Copacetic apt repository</title>
<h1>Copacetic apt repository</h1>
<p>This branch hosts the Debian package repository for
<a href="https://github.com/ryjord/Copacetic">Copacetic</a>. It is written by the
release workflow and is not edited by hand.</p>
<p>Installing the <code>.deb</code> registers this repository automatically, so
updates arrive with a normal <code>apt upgrade</code>.</p>
