<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Copacetic's mark: an all-clear indicator.

    The name means "everything is in order", and the interface's one rule is
    that colour appears only where it reports state. So the icon is exactly
    that — a status lamp reading clear — rather than a letterform.
  -->
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141C26"/>
      <stop offset="100%" stop-color="#080B0F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7FD1AE" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#7FD1AE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#surface)"/>
  <rect x="4" y="4" width="1016" height="1016" rx="226" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="8"/>

  <circle cx="512" cy="512" r="300" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="228" fill="none" stroke="#7FD1AE" stroke-opacity="0.34" stroke-width="20"/>
  <circle cx="512" cy="512" r="116" fill="#7FD1AE"/>
</svg>
