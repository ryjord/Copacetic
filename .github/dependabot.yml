# Chromium currency is a security property in a browser, not hygiene: every
# fix that lands upstream stays exploitable here until Electron is bumped. A
# weekly pull request is the difference between updating on a schedule and
# updating when someone remembers.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # react and react-dom check each other's version when they load and refuse
      # to run at all when they differ, so a pull request moving one without the
      # other cannot pass — it is one update, not two, and splitting it produced
      # two guaranteed-red pull requests. Listed before the routine group because
      # the first matching group wins.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      # Same reason, one layer out: the plugin declares a peer range on vite, so
      # a major on either is only installable alongside the other.
      vite:
        patterns: ['vite', '@vitejs/*']
      # One pull request for the ordinary churn, so the noise stays in a single
      # place and the ones worth reading stand alone.
      routine:
        patterns: ['*']
        exclude-patterns: ['electron', 'electron-builder', 'electron-updater', 'next']
        update-types: [minor, patch]
    ignore:
      # ESLint 10 installs and the config loads, but eslint-plugin-react — pulled
      # in by eslint-config-next — calls an API it removed:
      # `contextOrFilename.getFilename is not a function`, while loading
      # react/display-name. 7.37.5 is the latest published version of that plugin
      # and it peers on `eslint ^3 || ... || ^9.7`, so there is nothing to move
      # to. Drop this when the plugin declares ESLint 10.
      - dependency-name: 'eslint'
        versions: ['>=10']
      # TypeScript 7 compiles this repo. Measured 2 Sep 2026: all four projects
      # typecheck, the main process still emits CommonJS, and all 35 smoke tests
      # pass in a real Electron. The only source change needed is
      # tsconfig.electron.json moving `"module": "CommonJS"` and
      # `"moduleResolution": "node"` to `"node16"` for both, because TS 7 removed
      # node10 resolution. Lint is what blocks it: typescript-eslint refuses with
      # "does not support TS 7.0", and its latest release peers
      # `typescript >=4.8.4 <6.1.0`. Drop this when that range opens; the
      # migration is that one config line.
      - dependency-name: 'typescript'
        versions: ['>=7']
      # @types/node describes the APIs of a Node it is versioned against, and
      # types ahead of the runtime let code compile against functions that will
      # not exist when it runs — a failure typecheck cannot see. Pinned to the
      # major we build on; raise this deliberately when that moves.
      - dependency-name: '@types/node'
        versions: ['>=25']
    labels: [dependencies]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: ci
