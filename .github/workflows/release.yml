name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Minting the provenance attestation: an identity for this run to sign with,
  # and somewhere to record what it signed.
  id-token: write
  attestations: write

jobs:
  guard:
    name: Check the tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Nothing else enforces this, and a mismatch ships installers whose
      # version disagrees with the tag people downloaded them from.
      - name: Compare versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "Releasing $pkg"

      # The .deb is built with the repository URL baked in, and it is published
      # before the apt job runs. If the bucket turns out to be unusable at that
      # point, the package is already out there pointing at a source that does
      # not work — which is exactly how 1.1.0 went wrong. So the bucket is
      # checked before anything is built.
      - name: Check the package repository is usable
        if: vars.APT_REPO_URL != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.R2_ACCOUNT_ID }}" ] || [ -z "${{ vars.R2_BUCKET }}" ]; then
            echo "::error::APT_REPO_URL is set but the bucket is not configured."
            exit 1
          fi

          aws s3 ls "s3://${{ vars.R2_BUCKET }}/" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" > /dev/null
          echo "  bucket is writable"

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${{ vars.APT_REPO_URL }}/")
          case "$code" in
            200|404) echo "  public url answers ($code)" ;;
            *) echo "::error::${{ vars.APT_REPO_URL }} answered $code; is public access on?"; exit 1 ;;
          esac

  release:
    name: Release (${{ matrix.os }})
    needs: guard
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Everything a person downloading this release can hold, not only the
          # installers: the update metadata names the hash electron-updater
          # checks, and the blockmaps are what a differential update fetches.
          # Attesting the installer and leaving those unverifiable meant a
          # release could only be checked in part.
          - os: macos-latest
            artifacts: |
              release/*.dmg
              release/*.blockmap
              release/latest-mac.yml
          - os: ubuntu-latest
            artifacts: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml
          - os: windows-latest
            artifacts: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # The .deb only registers an apt source when one is actually hosted, so
      # both the key and the URL are embedded together or not at all. Set the
      # APT_REPO_URL repository variable to turn this on; until then the
      # package installs without touching apt, which is the honest state.
      #
      # It is deliberately not GitHub Pages: a repository rejects any file over
      # 100 MB and this .deb is around 150 MB, so the packages have to live on
      # object storage.
      - name: Embed the apt signing key and source URL
        if: matrix.os == 'ubuntu-latest' && vars.APT_REPO_URL != '' && env.APT_GPG_PRIVATE_KEY != ''
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          mkdir -p build/keyring
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --export > build/keyring/copacetic-archive-keyring.gpg
          printf '%s' "${{ vars.APT_REPO_URL }}" > build/keyring/copacetic-apt-source
          test -s build/keyring/copacetic-archive-keyring.gpg
          test -s build/keyring/copacetic-apt-source

      - name: Build and publish
        shell: bash
        run: |
          # package.json pins releaseType to `release`, which would publish a
          # beta as though it were finished. A tag carrying a prerelease part
          # overrides it, so the GitHub release is marked accordingly and
          # electron-updater keeps it on its own channel.
          case "$GITHUB_REF_NAME" in
            *-*) npx electron-builder --publish always -c.publish.releaseType=prerelease ;;
            *)   npx electron-builder --publish always ;;
          esac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple Developer certificate is configured, so let the build run
          # ad-hoc signed rather than failing while looking for one.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # The builds are not signed, so nothing says who made them. This is the
      # other half of that question and the half that costs nothing: GitHub
      # attests that these exact files came out of this workflow at this commit,
      # and anyone can check it before installing:
      #
      #   gh attestation verify Copacetic-1.3.4.dmg --repo ryjord/Copacetic
      #
      # It does not make a download trusted. It makes it checkable, which is
      # what an unsigned build otherwise cannot offer at all.
      - name: Attest what was built
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.artifacts }}

  # A release missing a platform is not obviously broken from the outside: the
  # page still lists installers, just not all of them, and the people affected
  # are the ones who cannot see what everyone else got. Two releases went out
  # that way before anyone noticed, so the run now says so itself.
  complete:
    name: Check every platform actually published
    needs: release
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Compare the assets against what a release must contain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected="Copacetic-$version.dmg Copacetic-$version-arm64.dmg Copacetic-Setup-$version.exe \
                    Copacetic-$version.AppImage copacetic_${version}_amd64.deb \
                    latest.yml latest-mac.yml latest-linux.yml"

          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          missing=""
          for name in $expected; do
            printf '%s\n' "$assets" | grep -qx "$name" || missing="$missing $name"
          done

          if [ -n "$missing" ]; then
            echo "::error::This release is missing:$missing"
            exit 1
          fi
          echo "All platforms published."

  apt:
    name: Publish the apt repository
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Decide whether to publish
        id: gate
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_REPO_URL: ${{ vars.APT_REPO_URL }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          if [ -z "$APT_REPO_URL" ]; then
            echo "No APT_REPO_URL variable; no repository is hosted yet."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "No APT_GPG_PRIVATE_KEY secret; skipping the apt repository."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$R2_BUCKET" ] || [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_KEY" ]; then
            echo "Bucket credentials are incomplete; skipping rather than half-publishing."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The repository serves one suite, `stable`, so a prerelease must not
          # go into it — everyone on the apt source would be offered a beta as
          # if it were a release. Betas are downloaded from the release page.
          case "$GITHUB_REF_NAME" in
            *-*)
              echo "$GITHUB_REF_NAME is a prerelease; leaving the stable suite alone."
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Install the archive tools
        if: steps.gate.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg

      # The bucket carries every previously published .deb. Rebuilding the
      # indexes from scratch each time would strand anyone still on an older
      # version, so the existing pool is pulled down and added to.
      #
      # Object storage rather than a git branch: GitHub rejects any file over
      # 100MB and this package is around 150MB, which is not a limit a Debian
      # package of an Electron app will ever fit inside.
      - name: Pull the existing pool
        if: steps.gate.outputs.run == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          mkdir -p pages/apt/pool/main
          aws s3 sync "s3://${{ vars.R2_BUCKET }}/pool" pages/apt/pool \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --no-progress
          ls -l pages/apt/pool/main || true

      - name: Collect the new package
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pages/apt/pool/main
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.deb' \
            --dir pages/apt/pool/main \
            --clobber
          ls -l pages/apt/pool/main

      # apt only needs the versions it might install. Every package kept is
      # ~150MB against a 10GB budget, so the pool holds the newest few and the
      # rest are dropped — including from the bucket, via the sync below.
      # The bucket this is published to has limited room and every release adds
      # a ~150MB package, so the pool cannot simply grow. Keeping the newest few
      # was wrong for the shape of the work: a run of patch releases inside one
      # minor line would evict every older line, and someone pinned to 1.3 would
      # find 1.3 had vanished from apt while 1.4.11, 1.4.12 and 1.4.13 sat there.
      #
      # So it keeps the newest package of each minor line instead. That is one
      # 1.2, one 1.3, one 1.4, one 1.5 — the four a person might reasonably still
      # be on — and it stays four however many patches each line accumulates.
      - name: Prune the pool to the newest package of each minor line
        if: steps.gate.outputs.run == 'true'
        working-directory: pages/apt/pool/main
        run: |
          set -eu
          if ! ls ./*.deb >/dev/null 2>&1; then
            echo "nothing in the pool."
            exit 0
          fi

          # copacetic_1.4.13_amd64.deb -> the line 1.4. The newest package of
          # each line is kept and the rest go. Written in plain sh rather than
          # with an associative array so it does not depend on the runner's
          # bash version.
          lines=$(ls -1 ./*.deb | sed 's/.*_\([0-9][0-9]*\.[0-9][0-9]*\)\..*/\1/' | sort -u)
          keep=""
          for line in $lines; do
            newest=$(ls -1 ./*.deb | grep "_${line}\." | sort -V | tail -1)
            keep="$keep $newest"
          done

          for package in ./*.deb; do
            case " $keep " in
              *" $package "*) ;;
              *) echo "  dropping $(basename "$package")"; rm -f "$package" ;;
            esac
          done
          echo "kept: $(ls -1 ./*.deb | xargs -n1 basename | tr '\n' ' ')"

      - name: Import the signing key
        if: steps.gate.outputs.run == 'true'
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build and sign the indexes
        if: steps.gate.outputs.run == 'true'
        working-directory: pages/apt
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "dists/stable/main/binary-$arch"
            apt-ftparchive --arch "$arch" packages pool > "dists/stable/main/binary-$arch/Packages"
            gzip -9kf "dists/stable/main/binary-$arch/Packages"
          done

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=Copacetic \
            -o APT::FTPArchive::Release::Label=Copacetic \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > dists/stable/Release

          rm -f dists/stable/Release.gpg dists/stable/InRelease
          gpg --batch --yes --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release
          gpg --batch --yes --clearsign -o dists/stable/InRelease dists/stable/Release

          # A repository that is published but unverifiable is worse than one
          # that failed to publish, so prove the signature before pushing.
          gpg --verify dists/stable/Release.gpg dists/stable/Release
          gpg --verify dists/stable/InRelease

      # Published alongside the repository so a machine that has never seen
      # Copacetic can add the source and install it. Without these the only way
      # in is downloading a .deb by hand, which rather defeats having a
      # repository at all.
      - name: Write the public key and a ready-made source file
        if: steps.gate.outputs.run == 'true'
        working-directory: pages/apt
        run: |
          set -euo pipefail
          gpg --export > copacetic-archive-keyring.gpg
          test -s copacetic-archive-keyring.gpg

          cat > copacetic.sources <<EOF
          Types: deb
          URIs: ${{ vars.APT_REPO_URL }}
          Suites: stable
          Components: main
          Architectures: amd64 arm64
          Signed-By: /usr/share/keyrings/copacetic-archive-keyring.gpg
          EOF

          # The fingerprint, so anyone can check the key they just fetched is
          # the one that signs these packages before trusting it.
          gpg --fingerprint --with-colons | awk -F: '/^fpr/{print $10; exit}' > copacetic-key-fingerprint.txt
          cat copacetic-key-fingerprint.txt

      - name: Publish
        if: steps.gate.outputs.run == 'true'
        working-directory: pages/apt
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          # Packages first, indexes last. An index naming a package that is not
          # there yet makes every apt update in between fail; the other way
          # round is merely a few minutes of not being offered the new version.
          aws s3 sync pool "s3://${{ vars.R2_BUCKET }}/pool" \
            --endpoint-url "$ENDPOINT" --no-progress --delete \
            --content-type application/vnd.debian.binary-package
          aws s3 sync dists "s3://${{ vars.R2_BUCKET }}/dists" \
            --endpoint-url "$ENDPOINT" --no-progress --cache-control 'no-cache'

          for file in copacetic-archive-keyring.gpg copacetic.sources copacetic-key-fingerprint.txt; do
            aws s3 cp "$file" "s3://${{ vars.R2_BUCKET }}/$file" \
              --endpoint-url "$ENDPOINT" --no-progress --cache-control 'no-cache'
          done

      # A repository apt cannot read is the same as no repository, and the only
      # honest moment to find that out is now rather than from a user.
      - name: Check apt can read what was just published
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          base="${{ vars.APT_REPO_URL }}"
          for file in dists/stable/InRelease dists/stable/Release dists/stable/Release.gpg \
                      copacetic-archive-keyring.gpg copacetic.sources; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$base/$file")
            echo "  $file -> $code"
            [ "$code" = "200" ] || { echo "::error::$base/$file answered $code"; exit 1; }
          done
