name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  guard:
    name: Check the tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nothing else enforces this, and a mismatch ships installers whose
      # version disagrees with the tag people downloaded them from.
      - name: Compare versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "Releasing $pkg"

  release:
    name: Release (${{ matrix.os }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # The .deb only registers an apt source when one is actually hosted, so
      # both the key and the URL are embedded together or not at all. Set the
      # APT_REPO_URL repository variable to turn this on; until then the
      # package installs without touching apt, which is the honest state.
      #
      # It is deliberately not GitHub Pages: a repository rejects any file over
      # 100 MB and this .deb is around 150 MB, so the packages have to live on
      # object storage.
      - name: Embed the apt signing key and source URL
        if: matrix.os == 'ubuntu-latest' && vars.APT_REPO_URL != '' && env.APT_GPG_PRIVATE_KEY != ''
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          mkdir -p build/keyring
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --export > build/keyring/copacetic-archive-keyring.gpg
          printf '%s' "${{ vars.APT_REPO_URL }}" > build/keyring/copacetic-apt-source
          test -s build/keyring/copacetic-archive-keyring.gpg
          test -s build/keyring/copacetic-apt-source

      - name: Build and publish
        shell: bash
        run: |
          # package.json pins releaseType to `release`, which would publish a
          # beta as though it were finished. A tag carrying a prerelease part
          # overrides it, so the GitHub release is marked accordingly and
          # electron-updater keeps it on its own channel.
          case "$GITHUB_REF_NAME" in
            *-*) npx electron-builder --publish always -c.publish.releaseType=prerelease ;;
            *)   npx electron-builder --publish always ;;
          esac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple Developer certificate is configured, so let the build run
          # ad-hoc signed rather than failing while looking for one.
          CSC_IDENTITY_AUTO_DISCOVERY: false

  apt:
    name: Publish the apt repository
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Decide whether to publish
        id: gate
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_REPO_URL: ${{ vars.APT_REPO_URL }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          if [ -z "$APT_REPO_URL" ]; then
            echo "No APT_REPO_URL variable; no repository is hosted yet."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "No APT_GPG_PRIVATE_KEY secret; skipping the apt repository."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$R2_BUCKET" ] || [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_KEY" ]; then
            echo "Bucket credentials are incomplete; skipping rather than half-publishing."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The repository serves one suite, `stable`, so a prerelease must not
          # go into it — everyone on the apt source would be offered a beta as
          # if it were a release. Betas are downloaded from the release page.
          case "$GITHUB_REF_NAME" in
            *-*)
              echo "$GITHUB_REF_NAME is a prerelease; leaving the stable suite alone."
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Install the archive tools
        if: steps.gate.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg

      # The bucket carries every previously published .deb. Rebuilding the
      # indexes from scratch each time would strand anyone still on an older
      # version, so the existing pool is pulled down and added to.
      #
      # Object storage rather than a git branch: GitHub rejects any file over
      # 100MB and this package is around 150MB, which is not a limit a Debian
      # package of an Electron app will ever fit inside.
      - name: Pull the existing pool
        if: steps.gate.outputs.run == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          mkdir -p pages/apt/pool/main
          aws s3 sync "s3://${{ vars.R2_BUCKET }}/apt/pool" pages/apt/pool \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --no-progress
          ls -l pages/apt/pool/main || true

      - name: Collect the new package
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pages/apt/pool/main
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.deb' \
            --dir pages/apt/pool/main \
            --clobber
          ls -l pages/apt/pool/main

      - name: Import the signing key
        if: steps.gate.outputs.run == 'true'
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build and sign the indexes
        if: steps.gate.outputs.run == 'true'
        working-directory: pages/apt
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "dists/stable/main/binary-$arch"
            apt-ftparchive --arch "$arch" packages pool > "dists/stable/main/binary-$arch/Packages"
            gzip -9kf "dists/stable/main/binary-$arch/Packages"
          done

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=Copacetic \
            -o APT::FTPArchive::Release::Label=Copacetic \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > dists/stable/Release

          rm -f dists/stable/Release.gpg dists/stable/InRelease
          gpg --batch --yes --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release
          gpg --batch --yes --clearsign -o dists/stable/InRelease dists/stable/Release

          # A repository that is published but unverifiable is worse than one
          # that failed to publish, so prove the signature before pushing.
          gpg --verify dists/stable/Release.gpg dists/stable/Release
          gpg --verify dists/stable/InRelease

      - name: Publish
        if: steps.gate.outputs.run == 'true'
        working-directory: pages/apt
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          # Packages first, indexes last. An index naming a package that is not
          # there yet makes every apt update in between fail; the other way
          # round is merely a few minutes of not being offered the new version.
          aws s3 sync pool "s3://${{ vars.R2_BUCKET }}/apt/pool" \
            --endpoint-url "$ENDPOINT" --no-progress --content-type application/vnd.debian.binary-package
          aws s3 sync dists "s3://${{ vars.R2_BUCKET }}/apt/dists" \
            --endpoint-url "$ENDPOINT" --no-progress --cache-control 'no-cache'

      # A repository apt cannot read is the same as no repository, and the only
      # honest moment to find that out is now rather than from a user.
      - name: Check apt can read what was just published
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          base="${{ vars.APT_REPO_URL }}"
          for file in dists/stable/InRelease dists/stable/Release dists/stable/Release.gpg; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$base/$file")
            echo "  $file -> $code"
            [ "$code" = "200" ] || { echo "::error::$base/$file answered $code"; exit 1; }
          done
