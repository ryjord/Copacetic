name: CI

on:
  push:
    branches: [main, development]
  pull_request:

# Read-only, stated rather than inherited. Without a block here a workflow gets
# whatever the repository's default is, which is a write token in a repository
# that has never changed the setting — handed to every action in every job, for
# a workflow that only needs to read the code it is checking.
permissions:
  contents: read

# Work lands on `development` in a stream of commits before it reaches `main`.
# Without this, every push queues a fresh three-OS matrix behind the last one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit, with the tag beside it for reading. A tag is a
# pointer someone else can move: `@v7` today and `@v7` after a compromised
# release are the same line in this file and different code on the runner.

jobs:
  verify:
    name: Verify
    # A job that hangs should fail rather than run until someone notices.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # The verify job never launches Electron, so skip the ~100MB binary.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

      # Advisory rather than blocking: a new advisory against a transitive
      # dependency should be visible on the next run, not something that stops
      # unrelated work until someone triages it.
      - name: Known vulnerabilities
        run: npm audit --audit-level=high || echo "::warning::npm audit reported findings above high"

  build:
    name: Build (${{ matrix.os }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # The only step that starts the app. Everything else here proves it
      # compiles and packages; this proves it opens, which is the one failure a
      # person experiences as total. Run on all three because two of them are
      # platforms nobody here has to test on.
      - name: Smoke test the built app
        if: runner.os != 'Linux'
        run: npm run smoke

      # Electron needs a display even to open a window it never shows.
      - name: Smoke test the built app
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke

      - name: Check the packaged tree assembles
        run: npx electron-builder --dir --publish never

      # Assembling it is not the same as it working. Everything above runs
      # `electron .` against the source tree, which proves the code is right and
      # says nothing about what is shipped — a file left out of `files`, a
      # dependency pruned that was needed, a preload the packaged app cannot
      # find. All of those reach a release otherwise, and one of them did: the
      # app carried 246MB of build tools it never loaded, and taking them out was
      # only safe because the packaged binary was started by hand afterwards.
      - name: Start the packaged app
        if: runner.os != 'Linux'
        run: npm run check:packaged

      - name: Start the packaged app
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run check:packaged

      # The installers themselves, on the branches a tag is cut from. `--dir`
      # produces a tree, not a .dmg, .exe or .deb, so anything that only breaks
      # while building an installer was first seen during a release — which is
      # how a line-ending change to the filter lists came to fail the Windows
      # build of 1.4.0 and not a single run before it.
      #
      # Not on pull requests: it is ten minutes a platform, and the branches
      # below are the only ones a release is ever tagged from.
      - name: Build the installers
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'development')
        run: npx electron-builder --publish never

      # Without this a platform-specific packaging failure can only be
      # reproduced by building locally on that platform, which for two of the
      # three is not something anyone here can do.
      - name: Keep the packaged tree for inspection
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-${{ matrix.os }}
          path: release/**/*
          retention-days: 5
          if-no-files-found: ignore
